# This is a basic workflow to help you get started with Actions

name: build nginx-patch with zlib-ng Compiler musl-gcc (test) with PGO (Profile Guided Optimization) enabled

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  #push:
    #branches:
      #- main
      #- b*
  #pull_request:
    #branches:
      #- main
      #- b*

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  release:
    types: [published]

# Set time zone
env:
  TZ: Asia/Shanghai

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    #runs-on: ubuntu-24.04
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7.0.1
      
      # Runs a set of commands using the runners shell
      - name: Runtime depend 
        run: |
          sudo apt-get update
          sudo apt-get upgrade 
          sudo apt-get install build-essential ca-certificates \
                               zlib1g-dev libpcre3 libpcre3-dev libssl-dev \
                               git cmake ninja-build gnupg2 lsb-release libunwind-dev \
                               tar unzip  wget curl tree perl-base
          sudo add-apt-repository ppa:maxmind/ppa
          sudo apt-get install -y libtool automake autoconf wrk golang-go bc
          sudo apt-get install -y libc6-dev libpcre3-dev zlib1g-dev
          sudo apt-get install -y libc6-dev glibc-source
          
          #sudo apt-get install -y libc6-dev libpcre3-dev zlib1g-dev libstdc++-staticgcc g++-static
      # 注意：某些高版本 Ubuntu 移除了 glibc 的静态库，全静态链接可能会提示找不到 -lc 或 -lpthread

      # zlib1g-dev libc6-dev    
      #- name: Setup Go environment
        #uses: actions/setup-go@v4.0.1
        #with:
         #go-version: ^1.19
         #check-latest: true
         
      #- name: Go version
        #run:  |
         #go version
         
      - name: Setup GCC environment
        uses: egor-tensin/setup-gcc@v2.0
        with:
         version: 16
         platform: x64 
      
      - name: Install musl toolchain
        run: |
          sudo apt-get install -y  musl musl-dev musl-tools linux-libc-dev
          # 核心修复：将 Linux 内核头文件软链接到 musl 的搜索路径中，防止符号污染
          sudo ln -s /usr/include/linux /usr/include/x86_64-linux-musl/linux
          sudo ln -s /usr/include/asm-generic /usr/include/x86_64-linux-musl/asm-generic
          #sudo ln -s /usr/include/asm /usr/include/x86_64-linux-musl/asm
          sudo ln -sf /usr/include/x86_64-linux-gnu/asm /usr/include/x86_64-linux-musl/asm
            
      - name: Verify installation
        run: |
           # 验证两个编译器是否正常工作
           musl-gcc --version
           #musl-g++ --version
      
      - name: openssl-4.1
        env: 
          #OPENSSL_COMMIT_ID_LOCAL : dcc2a2dcd4120543aa8a967e26dcd5dba20053d1

          OPENSSL_COMMIT_ID_LOCAL : f89540d7ccf89d91d4bc3c6fafd0c0a3585a4457
        run: |
          #git clone --recurse-submodules https://github.com/openssl/openssl.git
          #git clone --recurse-submodules -b openssl-3.6 --depth 1 https://github.com/openssl/openssl.git
          git clone --recurse-submodules -b openssl-4.1 --depth 1 https://github.com/openssl/openssl.git
          
          cd openssl
          #git reset --hard 78f65b1e09132b0170cd56e8d5758912754c470c

          #git fetch --depth 1 origin ${OPENSSL_COMMIT_ID_LOCAL}
          #git reset --hard ${OPENSSL_COMMIT_ID_LOCAL}
          
          #git fetch --depth 1 origin dcc2a2dcd4120543aa8a967e26dcd5dba20053d1
          #git reset --hard dcc2a2dcd4120543aa8a967e26dcd5dba20053d1
          git submodule update --init --recursive
          
          echo "Openssl_Commit_ID=$(git rev-parse --short HEAD) " >> $GITHUB_ENV
          cd ..
          
          #mkdir openssl/build
          #cd openssl/build
          #sudo ../Configure
          #sudo make
          #sudo make install
          ##sudo ldconfig /usr/local/lib64
          #sudo ldconfig
          #cd ../..
          ##openssl version -d
          
      - name: brotli
        env:
          CC: musl-gcc
          CXX: musl-g++
        run: |
          git clone --recurse-submodules -j8 https://github.com/google/ngx_brotli
          cd ngx_brotli/deps/brotli
          mkdir out && cd out
          
          # 核心修复：强制注入并卡死 musl-gcc 编译器，并生成纯静态库
          cmake \
            -DCMAKE_C_COMPILER=musl-gcc \
            -DCMAKE_CXX_COMPILER=musl-g++ \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_C_FLAGS="-static -O2" \
            -DCMAKE_CXX_FLAGS="-static -O2" \
            -DCMAKE_INSTALL_PREFIX=./installed ..
            
            
          #-DCMAKE_C_FLAGS="-static -O2 -ffunction-sections -fdata-sections" \  
          #cmake --build . --config Release --target brotlienc
          
          # 注意：这里需要同时编译 brotlienc 和 brotlicommon 两个目标
          #cmake --build . --config Release --target brotlienc brotlicommon
          cmake --build . --config Release --target brotlienc brotlicommon brotlidec
          
          cd ../../../..
          
      #- name: zlib-cf
        #run: |
          #git clone -b gcc.amd64  https://github.com/cloudflare/zlib.git zlib-cf
          #cd zlib-cf
          #make -f Makefile.in distclean
          #git checkout .
          #git pull
          #git submodule update --init --recursive
          #cd ..
      
      - name: zlib-ng [Pre-configure zlib-ng for Musl]
        env:
          CC: musl-gcc
          CXX: musl-g++
        run: |
          #git clone --branch develop https://github.com/zlib-ng/zlib-ng.git
          git clone https://github.com/zlib-ng/zlib-ng.git
          cd zlib-ng 
          
          # 核心注入：修改默认配置，强行将原生 API 切换为 zlib 1.x 兼容接口
          #sed -i 's/compat=0/compat=1/g' configure
          
          # 核心注入：必须开启兼容模式，且伪装成原生配置脚本
          #./configure --zlib-compat
          ./configure --static --zlib-compat
          
          #make -j$(nproc --all) libz.a
          make -j$(nproc --all)
          cd ..
          
          #...
          #auto/configure --with-cc-opt=-I/path/zlib-ng/include --with-ld-opt=-L/path/zlib-ng/lib
      
      
      
      - name: pcre2
        run: |
          git clone --recurse-submodules https://github.com/PCRE2Project/pcre2.git
          cd pcre2
          #git checkout .
          #git pull
          ./autogen.sh
          
          #./configure --enable-jit=auto --enable-pcre2-16 --enable-pcre2-32
          #./configure --enable-jit --enable-pcre2-16 --enable-pcre2-32
          #sudo make -j$(nproc --all)
          #sudo make install
          
          ##export LD_LIBRARY_PATH=/usr/local/lib:/usr/local/lib64
          ##sudo ldconfig
          
          #sudo ldconfig /usr/local/lib64
          #sudo ldconfig /usr/local/lib
          
          cd ..
                
      # --- 第一阶段：插桩编译 (Instrument Build) ---
      - name: Stage 1 - Instrument Build
        env:
          CC: musl-gcc
          CXX: musl-g++
        
        run: |
          git clone https://github.com/nginx/nginx.git
          cd nginx
          echo "Commit_ID=$(git rev-parse --short HEAD) " >> $GITHUB_ENV
          
          curl https://raw.githubusercontent.com/rosebe/nginx-patch/refs/heads/main/nginx_dynamic_tls_records.patch | patch --verbose -p 1
          
          # 1. 彻底清理上一次失败的残留缓存
          rm -rf objs/
          
          # 2. 终极净化：在 configure 阶段彻底去掉 -flto、-fprofile-generate。
          # 只留最普通的编译参数，确保在 Ubuntu GCC 13 + musl 下 100% 成功。
          ./auto/configure \
            --with-cc=musl-gcc \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib64/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/var/run/nginx.pid \
            --lock-path=/var/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --add-module=../ngx_brotli \
            --with-openssl=../openssl \
            --with-openssl-opt='no-shared no-comp enable-tls1_3' \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --build="Commit ID: $(git rev-parse --short HEAD). Openssl_Commit_ID: aecccf9 . Rosebe Add patch: Dynamic TLS Record support. Add with-zlib: zlib-ng. Compiler musl-gcc. And build on $(date +%Y_%m_%d-%H:%M:%S)"
          
          # 3. 终极黑魔法：绕过 Nginx 检测后，直接向 objs/Makefile 强制追加你所需的所有性能和 PGO 优化参数！
          # 这能保证检测时畅通无阻，但在后续通过 make 编译主二进制时完美应用你的最强参数。
          sed -i 's|CFLAGS = |CFLAGS = -static -O3 -march=x86-64 -flto=auto -fprofile-generate=/tmp/pgo-data -I../zlib-ng |g' objs/Makefile
          sed -i 's|MAIN_LINK = |MAIN_LINK = -static -flto=auto -fprofile-generate=/tmp/pgo-data -L../zlib-ng |g' objs/Makefile
          
          # 4. 开启并发编译，并导出错误实体
          make -j$(nproc --all) || (cat objs/autoconf.err && exit 1)
          
          echo ""
          echo "GITHUB_WORKFLOW is:" $GITHUB_WORKFLOW
          echo ""
          
      - name: Stage 2 - Full Scenario Training (PGO)
        run: |
            # 1. [变量拼接协议 - 防裁剪]
            G_RAW="https://raw.githubusercontent.com"
            G_PROTO_PATH="/grpc/grpc-go/master/examples/helloworld/helloworld/helloworld.proto"
            G_HOST="https://github.com"
            G_REPO="/grpc/grpc-go.git"
            
            NGINX_BIN="/home/runner/work/nginx-quic/nginx-quic/nginx/objs/nginx"
            G_WORKSPACE="${{ github.workspace }}"

            # 2. [环境整备]
            sudo apt-get update && sudo apt-get install -y wrk openssl bc
            rm -rf /tmp/pgo-run /tmp/pgo-data
            mkdir -p /tmp/pgo-run/{proto,geoip,logs,client_body_temp,proxy_temp,fastcgi_temp,uwsgi_temp,scgi_temp} /tmp/pgo-data
            chmod -R 777 /tmp/pgo-run /tmp/pgo-data

            # 2.1 [生成 NGINX HTTPS 使用的证书}
            sudo openssl req -x509 -nodes -days 1 -newkey rsa:2048 \
                  -keyout /tmp/pgo-run/server.key \
                  -out /tmp/pgo-run/server.crt \
                  -subj "/CN=example.com"
            
            # 3. [资源分发]
            cp "$G_WORKSPACE/pgo.conf" /tmp/pgo-run/pgo.conf
            cp "$G_WORKSPACE/GeoLite2-Country.mmdb" /tmp/pgo-run/geoip/GeoLite2-Country.mmdb
            curl -Lf -sSL "${G_RAW}${G_PROTO_PATH}" -o /tmp/pgo-run/proto/helloworld.proto

            go install "github.com/bojand/ghz/cmd/ghz@latest"
            export PATH=$PATH:$(go env GOPATH)/bin

            # --- [启动 gRPC 桩服务] ---
            git clone --depth 1 "${G_HOST}${G_REPO}"
            cd grpc-go/examples/helloworld/greeter_server
            go run main.go > /tmp/grpc-backend.log 2>&1 &
            BACKEND_PID=$!
            cd -

            # [重要：等待 gRPC 后端就绪]
            echo ">> 等待 gRPC 后端 (50051) 就绪..."
            timeout 30s bash -c 'until nc -z localhost 50051; do sleep 1; done' || echo "⚠️ gRPC 后端启动超时"


            # 5. [插桩启动 - 核心修正：启动前导出变量]
            echo ">> 启动插桩版 Nginx (Path: /tmp/pgo-data)..."
            export GCOV_PREFIX="/tmp/pgo-data"
            export GCOV_PREFIX_STRIP=0
            # 使用 -E 传递环境变量给 sudo 
            sudo -E "$NGINX_BIN" -p /tmp/pgo-run -c /tmp/pgo-run/pgo.conf > /tmp/pgo-run/logs/stdout.log 2>&1 &
            NGINX_PID=$!
            
            # [重要：等待 Nginx 端口就绪]
            echo ">> 等待 Nginx (8081) 就绪..."
            timeout 10s bash -c 'until nc -z localhost 8081; do sleep 1; done' || exit 1

            
            #sleep 5
            #kill -0 $NGINX_PID || { cat /tmp/pgo-run/logs/stdout.log; exit 1; }

            # 6. [精准压测]
            # A. Stream 压测优化
            echo ">>  Stream 压测优化..."
            # 精准训练方案：让 wrk 发起真正的 TLS 握手敲击 8443
            # 加上 --timeout 确保 Actions 稳定，由于 8082 拥有完美证书，这里将打通真正的双层 TLS 闭环训练
            wrk -t2 -c200 -d12s --latency --timeout 2s \
                -H "Host: example.com" \
                https://127.0.0.1:8443

           
                       
            # B. gRPC (增加容错，避免 502 导致 Action 中断)
            echo ">>  gRPC Stream 压测优化..."
            
            #ghz --insecure --proto /tmp/pgo-run/proto/helloworld.proto \
            #    --call helloworld.Greeter.SayHello \
            #    -n 1000 127.0.0.1:8081 || true
            
            # 优化方案：为了让 GCC 记录下高并发下的线程锁（Mutex）、内存分配（malloc/free）以及连接池复用逻辑，应当增加总请求量，并显式指定高并发数（-c）和持续时间（-z）。
            # -c 100: 保持 100 个并发连接
            # -n 20000: 提升到 2 万次请求，确保压测持续一定时间
            # --timeout 2s: 避免慢请求卡住
            ghz --insecure --proto /tmp/pgo-run/proto/helloworld.proto \
                --call helloworld.Greeter.SayHello \
                -c 100 -n 30000 --timeout 2s --keepalive 10s 127.0.0.1:8081 || true

            # C. HTTP/WS (指向 8081)
            echo ">>  HTTP/WebSocket 压测优化 ..."
           
            #wrk -t2 -c50 -d10s -H "Upgrade: websocket" -H "Connection: Upgrade" http://127.0.0.1:8081
            
            # 假设测试机有 4 核（-t4），并发提升到 200（-c200），时间保持 10~15 秒（-d12s）
            # 这样可以让 CPU 满载，以便 GCC 精准捕捉热点函数
            #wrk -t2 -c200 -d12s -H "Upgrade: websocket" -H "Connection: Upgrade" --latency http://127.0.0.1:8081
            wrk -t2 -c200 -d12s --latency \
                -H "Upgrade: websocket" \
                -H "Connection: Upgrade" \
                -H "Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==" \
                -H "Sec-WebSocket-Version: 13" \
                 http://127.0.0.1:8081/ws

            
            # D： 强力训练 HTTP 模块的 TLS 解密与证书处理逻辑
            # ==================================================
            echo ">> 正在强力训练 HTTP 模块的 TLS/HTTPS 状态机 压测优化..."
            # 使用 wrk 直接压测 8082 端口，由于走的是标准的 HTTPS，Nginx 的 TLS 握手、解密、ASN1 别名解析等核心热点代码将被完全灌满！
            wrk -t2 -c100 -d5s --latency https://127.0.0.1:8082

            
            
            
            # 7. [收割数据]
            echo ">> 正在触发 Profile 数据落盘..."
            [ -n "$NGINX_PID" ] && sudo kill -QUIT $NGINX_PID || true
            [ -n "$BACKEND_PID" ] && kill $BACKEND_PID || true
            sleep 10
            
            echo ">> 最终统计成果："
            find /tmp/pgo-data -name "*.gcda" | wc -l

      
      
      # --- 第三阶段：最终极致编译 (Final Optimization) ---
      - name: Stage 3 - Final Build
        env:
          CC: musl-gcc
          CXX: musl-g++
        
        run: |
          git clone https://github.com/nginx/nginx.git
          cd nginx
          #git reset --hard a4100450c067009158299ad69adb7d6f5e775943
          echo "Commit_ID=$(git rev-parse --short HEAD) " >> $GITHUB_ENV
          
                    
          curl https://raw.githubusercontent.com/rosebe/nginx-patch/refs/heads/main/nginx_dynamic_tls_records.patch | patch --verbose -p 1
          
          #cp ../nginx_dynamic_tls_records.patch ./nginx_dynamic_tls_records.patch
          #patch --verbose -p1 < nginx_dynamic_tls_records.patch
          
          #cp ../nginx.patch ./nginx.patch
          #patch -p1 < nginx.patch
          
          #cp ../option.patch ./option.patch
          #patch -p1 < option.patch
          
          #wget https://raw.githubusercontent.com/rosebe/patch/master/nginx.patch
          #patch -p1 < nginx.patch
          
          # 1. 设置 musl 编译器环境
          #export CC=musl-gcc
          #export CXX=musl-gcc
          
        
          # 强制清理之前可能残留的缓存
          #make clean || true
          rm -rf objs/

          
          ./auto/configure \
            --with-cc=musl-gcc \
            --prefix=/etc/nginx \
            --sbin-path=/usr/sbin/nginx \
            --modules-path=/usr/lib64/nginx/modules \
            --conf-path=/etc/nginx/nginx.conf \
            --error-log-path=/var/log/nginx/error.log \
            --http-log-path=/var/log/nginx/access.log \
            --pid-path=/var/run/nginx.pid \
            --lock-path=/var/run/nginx.lock \
            --http-client-body-temp-path=/var/cache/nginx/client_temp \
            --http-proxy-temp-path=/var/cache/nginx/proxy_temp \
            --http-fastcgi-temp-path=/var/cache/nginx/fastcgi_temp \
            --http-uwsgi-temp-path=/var/cache/nginx/uwsgi_temp \
            --http-scgi-temp-path=/var/cache/nginx/scgi_temp \
            --user=nginx \
            --group=nginx \
            --with-compat \
            --with-threads \
            --with-http_addition_module \
            --with-http_auth_request_module \
            --with-http_dav_module \
            --with-http_flv_module \
            --with-http_gunzip_module \
            --with-http_gzip_static_module \
            --with-http_mp4_module \
            --with-http_random_index_module \
            --with-http_realip_module \
            --with-http_secure_link_module \
            --with-http_slice_module \
            --with-http_ssl_module \
            --with-http_stub_status_module \
            --with-http_sub_module \
            --with-http_v2_module \
            --with-mail \
            --with-mail_ssl_module \
            --with-stream \
            --with-stream_realip_module \
            --with-stream_ssl_module \
            --with-stream_ssl_preread_module \
            --add-module=../ngx_brotli \
            --with-openssl=../openssl \
            --with-openssl-opt='no-shared no-comp enable-tls1_3' \
            --with-pcre=../pcre2 \
            --with-pcre-jit \
            --build="Commit ID: $(git rev-parse --short HEAD). Openssl_Commit_ID: ${{ env.Openssl_Commit_ID }}. Rosebe Add patch: Dynamic TLS Record support. Add with-zlib: zlib-ng. Compiler musl-gcc. PGO (Profile Guided Optimization) enabled. compatible x86-64. And build on $(date +%Y_%m_%d-%H:%M:%S)" \
            --with-cc-opt='-static -O3 -I../zlib-ng -march=x86-64 -flto=auto -fprofile-use -fprofile-correction -fprofile-dir=/tmp/pgo-data' \
            --with-ld-opt='-static -L../zlib-ng -flto=auto -fprofile-use -fprofile-dir=/tmp/pgo-data'

          #--with-zlib-opt='--static' \
          #--with-cc-opt='-static -static-libgcc -march=x86-64 -O2'

          #make -j$(nproc --all)
          make -j$(nproc --all) || (cat objs/autoconf.err && exit 1)
          #make || (cat objs/autoconf.err && exit 1)
          echo ""
          echo "GITHUB_WORKFLOW is:" $GITHUB_WORKFLOW
          echo ""
          tree -d
          
      
      
      
      - name: Verify
        run: |
          # 验证是否为静态链接
          # 验证生成的二进制文件是否为“纯静态”
          echo "==== 验证二进制文件状态 ===="
          #chmod +x /home/runner/work/nginx-patch/nginx-patch/nginx/objs/nginx
          file /home/runner/work/nginx-patch/nginx-patch/nginx/objs/nginx
          ldd /home/runner/work/nginx-patch/nginx-patch/nginx/objs/nginx || echo "Static binary confirmed"
            
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: nginx-patch
          path: /home/runner/work/nginx-patch/nginx-patch/nginx/objs/nginx
          
      # Setting an environment variable
      # https://docs.github.com/en/actions/reference/workflow-commands-for-github-actions
      - name: Set variables
        id: step_one
        shell: bash
        run: |
          echo "ASSET_NAME=nginx-patch-static v$(grep "#define NGINX_VERSION" /home/runner/work/nginx-patch/nginx-patch/nginx/src/core/nginx.h | awk '{print $3}' | tr -d '"') ${{ env.Commit_ID }} with-zlib-ng Compiler-musl-gcc PGO x86-64 test build on $(date +%Y_%m_%d-%H:%M:%S)" >> $GITHUB_ENV
